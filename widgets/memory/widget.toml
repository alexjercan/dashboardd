schema_version = 1
id = "memory"
name = "RAM"
description = "RAM and swap usage"

[backend]
package = "memory"

[frontend]
workspace = "@scufris/memory-widget"

[[frontend.variants]]
id = "full"
name = "Full"
size = [3, 3]
entry = "src/full.ts"

[[frontend.variants]]
id = "compact"
name = "Compact"
size = [1, 1]
entry = "src/compact.ts"

[[options]]
id = "show_swap"
name = "Show swap"
description = "Show swap usage in the detailed view"
variants = ["full"]
default = true

[options.boolean]
