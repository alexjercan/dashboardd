schema_version = 2
id = "tatr-tasks"
name = "Tatr Tasks"
description = "Read-only tasks across local Tatr projects"

backend = "dist/bin/tatr-tasks"

[[variants]]
id = "full"
name = "Tasks"
width = 3
height = 3
frontend = "frontend/dist/full.js"
focus = true

[[variants]]
id = "details"
name = "Artifact"
width = 3
height = 3
frontend = "frontend/dist/details.js"
focus = true

[[outputs]]
id = "selected_task"
name = "Selected task"
type = "tatr.task-selection/v1"
variants = ["full"]
required = false

[[inputs]]
id = "project"
name = "Project filter"
type = "dashboardd.project-selection/v1"
variants = ["full"]
required = false

[[inputs]]
id = "task"
name = "Linked task list"
type = "tatr.task-selection/v1"
variants = ["details"]
required = true

[[options]]
id = "root"
name = "Root"
description = "Absolute path or ~/ path containing Tatr projects"
variants = []
default = "~/personal"
type = "text"
multiline = false

[[options]]
id = "recursive"
name = "Recursive"
description = "Discover Tatr projects below the root"
variants = []
default = true
type = "boolean"

[[options]]
id = "filter"
name = "Filter"
variants = ["full"]
description = "Tatr query applied before tasks reach the dashboard"
default = ""
type = "text"
multiline = false

[[options]]
id = "sort"
name = "Sort"
variants = ["full"]
description = "Initial task order"
default = "priority"
type = "select"
choices = [
  { value = "created", name = "Created" },
  { value = "priority", name = "Priority" },
  { value = "title", name = "Title" },
]
