schema_version = 1
id = "tatr-tasks"
name = "Tatr Tasks"
description = "Read-only tasks across local Tatr projects"

[backend]
package = "tatr-tasks"

[frontend]
workspace = "@dashboardd/tatr-tasks-widget"

[[frontend.variants]]
id = "full"
name = "Tasks"
size = [3, 3]
entry = "src/full.ts"
focus = true

[[frontend.variants]]
id = "details"
name = "Artifact"
size = [3, 3]
entry = "src/details.ts"
focus = true

[[links.outputs]]
id = "selected_task"
name = "Selected task"
type = "tatr.task-selection/v1"
variants = ["full"]

[[links.inputs]]
id = "project"
name = "Project filter"
type = "dashboardd.project-selection/v1"
variants = ["full"]
required = false

[[links.inputs]]
id = "task"
name = "Linked task list"
type = "tatr.task-selection/v1"
variants = ["details"]
required = true

[[options]]
id = "root"
name = "Root"
description = "Absolute path or ~/ path containing Tatr projects"
default = "~/personal"

[options.text]

[[options]]
id = "recursive"
name = "Recursive"
description = "Discover Tatr projects below the root"
default = true

[options.boolean]

[[options]]
id = "filter"
name = "Filter"
variants = ["full"]
description = "Tatr query applied before tasks reach the dashboard"
default = ""

[options.text]

[[options]]
id = "sort"
name = "Sort"
variants = ["full"]
description = "Initial task order"
default = "priority"

[options.select]
choices = [
  { value = "created", name = "Created" },
  { value = "priority", name = "Priority" },
  { value = "title", name = "Title" },
]
