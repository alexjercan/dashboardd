schema_version = 1
id = "projects"
name = "Projects"
description = "Local project selection and read-only Git status"

[backend]
package = "projects"

[frontend]
workspace = "@dashboardd/projects-widget"

[[frontend.variants]]
id = "pulse"
name = "Project Pulse"
size = [3, 2]
entry = "src/pulse.ts"

[[frontend.variants]]
id = "brief"
name = "Project Brief"
size = [3, 2]
entry = "src/brief.ts"
focus = true

[[links.outputs]]
id = "selected_project"
name = "Selected project"
type = "dashboardd.project-selection/v1"
variants = ["pulse"]

[[links.inputs]]
id = "project"
name = "Project list"
type = "dashboardd.project-selection/v1"
variants = ["brief"]
required = true

[[options]]
id = "roots"
name = "Roots"
description = "One absolute or ~/ project root per line"
default = "~/personal\n~/personal/_tests\n~/work\n~/third-party"

[options.text]
multiline = true
