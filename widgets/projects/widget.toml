schema_version = 3
id = "projects"
name = "Projects"
description = "Local project selection and read-only Git status"

backend = "dist/bin/projects"

[[variants]]
id = "pulse"
name = "Project Pulse"
width = 3
height = 2
frontend = "frontend/dist/pulse.js"

[[variants]]
id = "brief"
name = "Project Brief"
width = 3
height = 2
frontend = "frontend/dist/brief.js"
focus = true

[[outputs]]
id = "selected_project"
name = "Selected project"
type = "dashboardd.project-selection/v1"
variants = ["pulse"]
required = false

[[inputs]]
id = "project"
name = "Project list"
type = "dashboardd.project-selection/v1"
variants = ["brief"]
required = true

[[options]]
id = "roots"
name = "Roots"
description = "One absolute or ~/ project root per line"
variants = []
default = "~/personal\n~/personal/_tests\n~/work\n~/third-party"
type = "text"
multiline = true
