schema_version = 1
id = "codex-usage"
name = "Codex Usage"
description = "Weekly Codex subscription limit"

[backend]
package = "codex-usage"

[frontend]
workspace = "@scufris/codex-usage-widget"

[[frontend.variants]]
id = "compact"
name = "Compact"
size = [3, 1]
entry = "src/compact.ts"

[[frontend.variants]]
id = "minimal"
name = "Minimal"
size = [1, 1]
entry = "src/minimal.ts"

[[options]]
id = "display_mode"
name = "Display"
description = "Show subscription usage or remaining allowance"
variants = ["compact"]
default = "remaining"

[options.select]
choices = [
  { value = "usage", name = "Usage" },
  { value = "remaining", name = "Remaining" },
]
