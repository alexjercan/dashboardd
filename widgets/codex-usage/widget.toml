schema_version = 3
id = "codex-usage"
name = "Codex Usage"
description = "Weekly Codex subscription limit"

backend = "dist/bin/codex-usage"

[[variants]]
id = "compact"
name = "Compact"
width = 3
height = 1
frontend = "frontend/dist/compact.js"

[[variants]]
id = "minimal"
name = "Minimal"
width = 1
height = 1
frontend = "frontend/dist/minimal.js"

[[options]]
id = "display_mode"
name = "Display"
description = "Show subscription usage or remaining allowance"
variants = ["compact"]
default = "remaining"
type = "select"
choices = [
  { value = "usage", name = "Usage" },
  { value = "remaining", name = "Remaining" },
]
