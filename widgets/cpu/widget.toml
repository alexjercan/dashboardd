schema_version = 3
id = "cpu"
name = "CPU"
description = "Processor usage and temperatures"

backend = "dist/bin/cpu"

[[variants]]
id = "full"
name = "Full"
width = 3
height = 3
frontend = "frontend/dist/full.js"

[[variants]]
id = "compact"
name = "Compact"
width = 1
height = 1
frontend = "frontend/dist/compact.js"

[[options]]
id = "show_core_temperatures"
name = "Show core temperatures"
description = "Show temperature inside each CPU core square"
variants = ["full"]
default = true
type = "boolean"

[[options]]
id = "history_points"
name = "History length"
description = "Number of samples retained in the graph"
variants = ["full"]
default = 40
type = "integer"
minimum = 20
maximum = 120
step = 10
