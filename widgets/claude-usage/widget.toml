schema_version = 3
id = "claude-usage"
name = "Claude Usage"
description = "Weekly Claude subscription limits"

backend = "dist/bin/claude-usage"

[[variants]]
id = "full"
name = "Full"
width = 3
height = 2
frontend = "frontend/dist/full.js"

[[variants]]
id = "compact"
name = "Compact"
width = 3
height = 1
frontend = "frontend/dist/compact.js"

[[variants]]
id = "minimal"
name = "Minimal"
width = 1
height = 1
frontend = "frontend/dist/minimal.js"

[[options]]
id = "display_mode"
name = "Display"
description = "Show subscription usage or remaining allowance"
variants = ["full"]
default = "remaining"
type = "select"
choices = [
  { value = "usage", name = "Usage" },
  { value = "remaining", name = "Remaining" },
]
