[workspace]
members = [
  "crates/dashboard-protocol",
  "crates/dashboardctl",
  "crates/dashboardd",
  "crates/dashboardd-runtime",
  "crates/dashboardd-desktop",
  "crates/dashboardd-desktop-control",
  "crates/dashboardd-widget",
  "widgets/claude-usage",
  "widgets/disk",
  "widgets/codex-usage",
  "widgets/cpu",
  "widgets/memory",
  "widgets/network",
  "widgets/projects",
  "widgets/tatr-tasks",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
