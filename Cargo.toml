[workspace]
members = [
  "crates/dashboard-protocol",
  "crates/dashboardd",
  "widgets/claude-usage",
  "widgets/codex-usage",
  "widgets/cpu",
  "widgets/memory",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
