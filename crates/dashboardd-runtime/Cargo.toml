[package]
name = "dashboardd-runtime"
description = "Reusable transport-free dashboardd widget runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dashboardd-widget-protocol = { path = "../dashboardd-widget-protocol" }
dashboardd-widget-bundle = { path = "../dashboardd-widget-bundle" }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4"] }

[lints]
workspace = true
