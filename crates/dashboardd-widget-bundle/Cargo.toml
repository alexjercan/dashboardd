[package]
name = "dashboardd-widget-bundle"
description = "Pack and statically validate dashboardd widget bundles"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dashboardd-widget"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.151"
thiserror = "2.0.18"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.24.0"

[lints]
workspace = true
