[package]
name = "dashboardd-server"
description = "HTTP and browser host for the dashboardd runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dashboardd"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
dashboardd-runtime = { path = "../dashboardd-runtime" }
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
