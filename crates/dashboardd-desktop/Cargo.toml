[package]
name = "dashboardd-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
dashboardd-desktop-control = { path = "../dashboardd-desktop-control" }
libc = "0.2.180"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["formatting"] }

[lints]
workspace = true
