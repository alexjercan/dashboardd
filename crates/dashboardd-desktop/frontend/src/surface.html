<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dashboardd Widget</title>
  </head>
  <body>
    <main id="surface" aria-live="polite">
      <section id="widget" class="surface-widget"></section>
      <aside id="health" class="surface-health" hidden>
        <span id="health-message"></span>
        <button id="restart" type="button">Restart</button>
      </aside>
      <section id="unavailable" class="surface-unavailable" hidden>
        <h1>Widget unavailable</h1>
        <p id="unavailable-message"></p>
      </section>
    </main>
  </body>
</html>
