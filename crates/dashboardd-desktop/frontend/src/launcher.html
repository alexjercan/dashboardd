<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open widget</title>
  </head>
  <body>
    <main class="launcher-shell">
      <header>
        <span class="eyebrow">Dashboardd</span>
        <h1 id="title">Open widget</h1>
        <p>Provide each typed JSON input for this window.</p>
      </header>
      <section id="custom-launcher" class="custom-launcher" hidden></section>
      <form id="launcher-form">
        <div id="inputs" class="inputs"></div>
        <p id="error" class="error" role="alert" hidden></p>
        <footer>
          <button id="cancel" type="button" class="secondary">Cancel</button>
          <button id="open" type="submit">Open</button>
        </footer>
      </form>
    </main>
  </body>
</html>
